<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Happy Boyfriend's Day, Samar ♡</title>

<style>
* {
  box-sizing: border-box;
}

html, body {
  margin: 0;
  min-height: 100%;
  background: #171a35;
  font-family: Arial, sans-serif;
}

body {
  display: flex;
  align-items: center;
  justify-content: center;
  min-height: 100vh;
  overflow: hidden;
}

.stage {
  position: relative;
  width: min(100vw, 520px);
  height: 100vh;
  max-height: 100svh;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 10px;
}

.frame {
  position: relative;
  width: 100%;
  height: 100%;
  display: flex;
  align-items: center;
  justify-content: center;
  perspective: 1000px;
}

img {
  display: block;
  max-width: 100%;
  max-height: 100%;
  width: auto;
  height: auto;
  object-fit: contain;
  border-radius: 8px;
  box-shadow: 0 18px 45px #0007;
  transform: rotateX(0deg) rotateY(0deg);
  transition: transform .35s ease, filter .35s ease,
              opacity .2s ease;
  user-select: none;
  -webkit-user-drag: none;
}

.frame:active img {
  transform: scale(.985) rotateX(1deg);
}

.glow {
  position: absolute;
  inset: 3%;
  pointer-events: none;
  border-radius: 12px;
  box-shadow: inset 0 0 0 1px #ffffff40,
              0 0 25px #f6c7e455;
  opacity: .7;
}

.controls {
  position: fixed;
  bottom: 14px;
  left: 50%;
  transform: translateX(-50%);
  display: flex;
  align-items: center;
  gap: 12px;
  z-index: 5;
  padding: 8px 12px;
  border-radius: 30px;
  background: #17152bd9;
  backdrop-filter: blur(10px);
  box-shadow: 0 6px 20px #0005;
}

.controls button {
  border: 1px solid #ffffff55;
  background: transparent;
  color: white;
  border-radius: 22px;
  padding: 9px 15px;
  font-size: 14px;
}

.controls button:active {
  transform: scale(.95);
}

.count {
  color: #fff;
  font-size: 12px;
  min-width: 46px;
  text-align: center;
}

.hint {
  position: fixed;
  top: 10px;
  left: 50%;
  transform: translateX(-50%);
  color: #fff;
  background: #17152b99;
  padding: 7px 12px;
  border-radius: 18px;
  font-size: 11px;
  z-index: 5;
  white-space: nowrap;
}

@media (min-width: 700px) {
  .stage {
    width: min(100vw, 520px);
  }
}
</style>
</head>

<body>

<div class="hint">Tap the page or use the arrows ♡</div>

<div class="stage">
  <div class="frame" id="frame">
    <img
      id="pageImage"
      src="pages/page-01.jpg"
      alt="Boyfriend's Day surprise page"
    >
    <div class="glow"></div>
  </div>
</div>

<div class="controls">
  <button id="prev" aria-label="Previous page">←</button>
  <span class="count" id="count">1 / 11</span>
  <button id="next" aria-label="Next page">Next →</button>
</div>

<script>
const total = 11;
let page = 1;

const img = document.getElementById('pageImage');
const count = document.getElementById('count');

function show(n) {
  page = Math.max(1, Math.min(total, n));

  img.style.opacity = '0';
  img.style.transform = 'rotateY(8deg) scale(.97)';

  setTimeout(() => {
    img.src = `pages/page-${String(page).padStart(2, '0')}.jpg`;
    count.textContent = `${page} / ${total}`;

    img.style.opacity = '1';
    img.style.transform = 'rotateY(0deg) scale(1)';
  }, 130);
}

document.getElementById('prev').addEventListener('click', () => {
  show(page === 1 ? total : page - 1);
});

document.getElementById('next').addEventListener('click', () => {
  show(page === total ? 1 : page + 1);
});

document.getElementById('frame').addEventListener('click', () => {
  show(page === total ? 1 : page + 1);
});

document.addEventListener('keydown', e => {
  if (e.key === 'ArrowRight') {
    show(page === total ? 1 : page + 1);
  }

  if (e.key === 'ArrowLeft') {
    show(page === 1 ? total : page - 1);
  }
});

let startX = 0;

document.addEventListener('touchstart', e => {
  startX = e.touches[0].clientX;
}, { passive: true });

document.addEventListener('touchend', e => {
  const dx = e.changedTouches[0].clientX - startX;

  if (Math.abs(dx) > 45) {
    show(dx < 0
      ? (page === total ? 1 : page + 1)
      : (page === 1 ? total : page - 1)
    );
  }
}, { passive: true });
</script>

</body>
</html>
